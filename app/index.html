<!DOCTYPE html>
<html lang="fr">

<head>
  <title>SAE2.03 APP</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./css/base.css" />
</head>

<body>
  <header id="header"></header>
  <section id="content"></section>

  <script type="module">
    import { NavBar } from "./component/NavBar/script.js";
    import { Movie } from "./component/Movie/script.js";
    import { DataMovie } from "./data/dataMovie.js";
    import { movieDetail } from "./component/movieDetail/script.js";
    import { MovieCategory } from "./component/MovieCategory/script.js";
    import { DataProfile } from "./data/dataProfile.js";

    let allProfiles = [];

    window.C = {};



    C.hSelectProfil = async function () {
      let id = document.querySelector('#navbar__select').value;
      if (id) {
        let profil = null;


        for (let i = 0; i < allProfiles.length; i++) {

          if (allProfiles[i].id == id) {
            profil = allProfiles[i];
          }
        }
        let age = profil.age_restriction;
        
        
        console.log("Valeur envoyée :", age);

        let films = await DataMovie.requestMovies(age);
        V.renderMovie(films);
      } else {
        C.handlerLogout();
      }
    };

    C.handlerDetail = async function (id) {
      let detail = await DataMovie.requestMovieDetails(id);
      V.rendermovieDetail(detail);
    };

    C.handlerLogout = function () {
      document.querySelector("#content").innerHTML = `
        <div class="logout-message">
            <h2 clas="Logout__titre">Déconnexion réussie</h2>
            <pclas="Logout__txt">Veuillez choisir un profil pour voir les films.</p>
        </div>`;

      let select = document.querySelector('#navbar__select');
      if (select) select.value = "";

    };

    C.start = async function () {

      allProfiles = await DataProfile.readAll();

      await V.renderNavBar();

      let content = document.querySelector("#content");
      content.innerHTML = `
        <div class="star">
            <h2 class="star__titre">Bienvenue</h2>
            <p class="star__titre">Veuillez sélectionner un profil en haut à droite pour voir les films.</p>
        </div>`;
    };

    window.V = {};

    V.renderNavBar = async function () {
      let profils = await DataProfile.readAll();
      let html = NavBar.format(profils, "C.handlerHome()", "C.handlerHome()", "C.hSelectProfil()");
      document.querySelector("#header").innerHTML = html;
    };

    V.renderMovie = function (data) {
      let content = document.querySelector("#content");
      let finalHtml = "";
      for (let CateName in data) {
        let categoryMovie = data[CateName];
        finalHtml += MovieCategory.format(CateName, categoryMovie);
      }
      content.innerHTML = finalHtml;
    };

    V.rendermovieDetail = function (Data) {
      let content = document.querySelector("#content");
      content.innerHTML = movieDetail.format(Data);
    };

    // Démarrage
    C.start(); 
  </script>
</body>

</html>
