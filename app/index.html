<!DOCTYPE html>
<html lang="fr">

<head>
  <title>SAE2.03 APP</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./css/base.css" />
</head>

<body class="body">
  <header id="header"></header>
  <section class="content" id="content"></section>

  <script type="module">
    import { NavBar } from "./component/NavBar/script.js";
    import { Movie } from "./component/Movie/script.js";
    import { DataMovie } from "./data/dataMovie.js";
    import { movieDetail } from "./component/movieDetail/script.js";
    import { MovieCategory } from "./component/MovieCategory/script.js";
    import { DataProfile } from "./data/dataProfile.js";
    import { Feature } from "./component/Feature/script.js";


    let allProfiles = [];
    window.C = {};


    C.hSelectProfil = async function () {
      let id = document.querySelector('#navbar__select').value;
      if (id) {
        let profil = null;
        for (let i = 0; i < allProfiles.length; i++) {

          if (allProfiles[i].id == id) {
            profil = allProfiles[i];
          }
        }
        let age = profil.age_restriction;
        console.log("Valeur envoyée :", age);

        let films = await DataMovie.requestMovies(age);
        V.renderMovie(films);
      } else {
        C.handlerLogout();
      }
    };


    C.handlerDetail = async function (id) {
    let id_profil = document.querySelector('#navbar__select').value;
    let detail = await DataMovie.requestMovieDetails(id);
    let isFav = false; 
    if (id_profil) {
        let mesFavoris = await DataMovie.getFavorites(id_profil);
        for (let i = 0; i < mesFavoris.length; i++) {
            if (mesFavoris[i].id == detail.id) {
                isFav = true; 
            }
        }
    }
    V.rendermovieDetail(detail, isFav);
};

    C.handlerLogout = function () {
      document.querySelector("#content").innerHTML = `
        <div class="star">
            <h2 class="star__titre">Déconnexion réussie</h2>
            <p class="star__txt">Veuillez choisir un profil pour voir les films.</p>
        </div>`;

      let select = document.querySelector('#navbar__select');
      if (select) select.value = "";

    };
    C.hAddFav = async function (id_film) {
      let id_profil = document.querySelector('#navbar__select').value;
      if (id_profil) {
        let result = await DataMovie.addFavorite(id_profil, id_film);
        if (result.status == "success") {
          alert("Le film a été ajouté à vos favoris.");
          C.handlerDetail(id_film);
        }
      } else {
        alert("Veuillez d'abord sélectionner un profil !");
      }
    };

   C.hdeleteFav = async function (id_film) {
  let id_profil = document.querySelector('#navbar__select').value;
  if (id_profil) {
    let result = await DataMovie.deleteFavorite(id_profil, id_film);
    if (result.status == "success") {
      alert("Le film a été retiré de vos favoris.");
      C.handlerDetail(id_film);
    }
  } else {
    alert("Veuillez d'abord sélectionner un profil !");
  }
};

    C.handlerHome = async function () {
      C.hSelectProfil()
    }


    C.start = async function () {

      allProfiles = await DataProfile.readAll();

      await V.renderNavBar();

      let content = document.querySelector("#content");
      content.innerHTML = `
        <div class="star">
            <h2 class="star__titre">Bienvenue</h2>
            <p class="star__txt">Veuillez sélectionner un profil en haut à droite pour voir les films.</p>
        </div>`;
    };

    window.V = {};

    V.renderNavBar = async function () {
      let profils = await DataProfile.readAll();
      let html = NavBar.format(profils, "C.handlerHome()", "C.hSelectProfil()");
      document.querySelector("#header").innerHTML = html;
    };



   V.renderMovie = async function (data) {
  let content = document.querySelector("#content");
  let id_profil = document.querySelector('#navbar__select').value;
  
  let finalHtml = "";
  if (id_profil) {
    let featuredData = await DataMovie.requestFeatured();
    finalHtml += Feature.format(featuredData);
    let favoris = await DataMovie.getFavorites(id_profil);
    if (favoris.length > 0) {
      finalHtml += MovieCategory.format("Ma Liste", favoris);
    }
  }
  for (let CateName in data) {
    let categoryMovie = data[CateName];
    finalHtml += MovieCategory.format(CateName, categoryMovie);
  }
  content.innerHTML = finalHtml;
};

    V.rendermovieDetail = function (Data, isFav) {
      let content = document.querySelector("#content");
      content.innerHTML = movieDetail.format(Data, isFav);
    };
    V.renderFavoris = async function (Data) {
      let content = document.querySelector("#content");
      let id_profil = document.querySelector('#navbar__select').value;
      let isFav = false;
      if (id_profil) {
        let mesFavoris = await DataMovie.getFavorites(id_profil);
        for (let i = 0; i < mesFavoris.length; i++) {
          if (mesFavoris[i].id == Data.id) {
            isFav = true;
          }
        }
      }

      content.innerHTML = movieDetail.format(Data, isFav);
    };

    // Démarrage
    C.start(); 
  </script>
</body>

</html>
